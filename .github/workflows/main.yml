name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir -p proyecto
          unzip -q *.zip -d proyecto
          echo "Proyecto:"
          find proyecto -maxdepth 2 -type f

      - name: Corregir Java 8 a Java 17
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' proyecto/app/build.gradle.kts
          sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' proyecto/app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' proyecto/app/build.gradle.kts
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" proyecto/app/build.gradle.kts
          sed -i 's/jvmTarget = "8"/jvmTarget = "17"/g' proyecto/app/build.gradle.kts
          sed -i "s/jvmTarget = '8'/jvmTarget = '17'/g" proyecto/app/build.gradle.kts

      - name: Configurar Gradle
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> proyecto/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> proyecto/gradle.properties

      - name: Forzar Java y Kotlin a 17
        run: |
          cat > proyecto/init.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug --no-daemon --stacktrace --init-script init.gradle

      - name: Buscar APK
        run: |
          find proyecto -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
