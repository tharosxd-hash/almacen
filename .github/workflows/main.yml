name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir -p proyecto
          unzip -q *.zip -d proyecto

          echo "Buscando proyecto Gradle..."
          find proyecto -name settings.gradle.kts -o -name settings.gradle

      - name: Detectar proyecto Gradle
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto -name settings.gradle.kts -o -name settings.gradle -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: No se encontró settings.gradle.kts ni settings.gradle"
            find proyecto -maxdepth 5 -type f
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> "$PROJECT_DIR/gradle.properties"

      - name: Ajustar Java y Kotlin a JVM 17
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          files = list(project.rglob("build.gradle.kts")) + list(project.rglob("build.gradle"))

          if not files:
              print("ERROR: No se encontraron archivos build.gradle")
              raise SystemExit(1)

          for file in files:
              text = file.read_text()

              # Java 8 -> Java 17
              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              # Kotlin JVM 1.8 -> 17
              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

              file.write_text(text)

              print(f"Configurado: {file}")
          PY

      - name: Verificar Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
