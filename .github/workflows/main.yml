name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q solicitud_almacen_firebase_java17.zip -d proyecto

      - name: Localizar proyecto Android
        run: |
          echo "Buscando proyecto..."
          find proyecto -name settings.gradle.kts -print
          find proyecto -name build.gradle.kts -print

      - name: Configurar Java 17 para Gradle
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto -name settings.gradle.kts -print -quit)")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "org.gradle.java.home=$JAVA_HOME" >> "$PROJECT_DIR/gradle.properties"

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          java -version
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
