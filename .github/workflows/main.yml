
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Solicitud Almacen
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Buscar proyecto Android
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . \
            -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE="$(find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './_build_source/*' \
              -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No se encontró el proyecto ni un ZIP."
              exit 1
            fi

            mkdir -p _build_source
            unzip -o "$ZIP_FILE" -d _build_source

            SETTINGS_FILE="$(find _build_source \
              -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -print -quit || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: El proyecto no contiene settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: No se encontró la configuración de app."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: Falta app/google-services.json."
            exit 1
          fi

          echo "Proyecto localizado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "${{ steps.locate.outputs.project_dir }}" \
            assembleDebug

      - name: Guardar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
