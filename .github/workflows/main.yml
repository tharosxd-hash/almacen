name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extraer ZIP corregido
        run: |
          set -e

          ZIP="solicitud_almacen_firebase_java17_corregido.zip"

          if [ ! -f "$ZIP" ]; then
            echo "❌ No existe el archivo:"
            echo "$ZIP"
            echo ""
            echo "Archivos encontrados:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf proyecto
          mkdir proyecto

          unzip -q "$ZIP" -d proyecto

          echo "✅ ZIP extraído correctamente"

      - name: Detectar proyecto Gradle
        run: |
          set -e

          GRADLEW=$(find proyecto -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "❌ No se encontró gradlew dentro del ZIP"
            find proyecto -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Proyecto encontrado en:"
          echo "$PROJECT_DIR"

      - name: Dar permisos a Gradle
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Mostrar versión Java
        run: java -version

      - name: Limpiar proyecto
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew clean --stacktrace

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Localizar APK
        run: |
          echo "APK generado:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: solicitud-almacen-debug
          path: '**/*.apk'
          if-no-files-found: error
