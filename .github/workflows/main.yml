name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir -p proyecto
          unzip -q *.zip -d proyecto
          echo "Proyecto encontrado:"
          find proyecto -maxdepth 2 -type f

      - name: Configurar Java y Kotlin 17
        run: |
          python3 <<'PY'
          from pathlib import Path

          file = Path("proyecto/app/build.gradle.kts")
          text = file.read_text()

          # Java 8 -> Java 17
          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # Kotlin 1.8/8 -> 17
          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '1.8'",
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '8'",
              'jvmTarget = "17"'
          )

          # Si no existe compileOptions, lo agregamos.
          if "compileOptions" not in text:
              text = text.replace(
                  "android {",
                  """android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }"""
              )

          file.write_text(text)

          print("Configuración aplicada correctamente.")
          PY

      - name: Configurar Gradle
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> proyecto/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> proyecto/gradle.properties

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          find proyecto -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
