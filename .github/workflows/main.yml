
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Encontrar proyecto Android
        id: proyecto
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit)

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/app/google-services.json" ]; then
            echo "ERROR: Falta app/google-services.json"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $DIR"

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.proyecto.outputs.dir }}" \
            assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: ${{ steps.proyecto.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
