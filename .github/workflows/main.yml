name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar y descomprimir ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="solicitud_almacen_firebase_total_corregido.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: No se encuentra $ZIP_NAME en la raíz del repositorio."
            exit 1
          fi

          mkdir -p proyecto
          unzip -q "$ZIP_NAME" -d proyecto

          if [ ! -f "proyecto/app/google-services.json" ]; then
            echo "ERROR: Falta app/google-services.json."
            exit 1
          fi

          SETTINGS_FILE=$(find proyecto -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          java -version
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
