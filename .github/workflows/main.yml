name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -euo pipefail
          ZIP="solicitud_almacen_app_mejorada.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra $ZIP en la raíz del repositorio."
            exit 1
          fi

          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto

          SETTINGS=$(find proyecto -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar Firebase
        run: |
          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "ERROR: Falta app/google-services.json"
            exit 1
          }

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
