name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir -p proyecto
          unzip -q *.zip -d proyecto

          echo "=== Estructura del proyecto ==="
          find proyecto -maxdepth 3 -type f | sort

      - name: Configurar Gradle
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> proyecto/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> proyecto/gradle.properties

      - name: Corregir configuración Java y Kotlin
        run: |
          python3 <<'PY'
          from pathlib import Path

          archivo = Path("proyecto/app/build.gradle.kts")

          if not archivo.exists():
              raise SystemExit("No existe proyecto/app/build.gradle.kts")

          texto = archivo.read_text()

          # Java 8 -> Java 17
          texto = texto.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          texto = texto.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # Kotlin antiguo
          texto = texto.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          texto = texto.replace(
              "jvmTarget = '1.8'",
              'jvmTarget = "17"'
          )

          texto = texto.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          texto = texto.replace(
              "jvmTarget = '8'",
              'jvmTarget = "17"'
          )

          # Si no existe compileOptions, agregarlo dentro de android
          if "compileOptions" not in texto:
              texto = texto.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          archivo.write_text(texto)

          print("=== build.gradle.kts corregido ===")
          print(texto)
          PY

      - name: Verificar configuración
        run: |
          echo "=== Java ==="
          java -version

          echo ""
          echo "=== Gradle ==="
          gradle --version

          echo ""
          echo "=== build.gradle.kts ==="
          cat proyecto/app/build.gradle.kts

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug --no-daemon --stacktrace

      - name: Buscar APK
        run: |
          echo "=== APK GENERADO ==="
          find proyecto -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
