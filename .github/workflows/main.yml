
name: Compilar APK Solicitud Almacen

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: solicitud-almacen-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar y preparar proyecto
        shell: bash
        run: |
          set -euo pipefail
          ZIP="solicitud_almacen_actualizacion_completa.zip"
          test -f "$ZIP" || {
            echo "ERROR: No se encuentra el ZIP esperado."
            exit 1
          }
          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto
          SETTINGS="$(find proyecto -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS" || {
            echo "ERROR: Falta settings.gradle.kts."
            exit 1
          }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "ERROR: Falta app/google-services.json."
            exit 1
          }
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || {
            echo "ERROR: Falta AndroidManifest.xml."
            exit 1
          }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar y comprobar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || {
            echo "ERROR: No se generó el APK."
            exit 1
          }

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
