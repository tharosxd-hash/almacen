name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir -p proyecto
          unzip -q *.zip -d proyecto

          echo "Contenido del proyecto:"
          find proyecto -maxdepth 3 -type f

      - name: Configurar proyecto
        run: |
          PROJECT_DIR="proyecto"

          echo "Proyecto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Configurar Java 17
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> "$PROJECT_DIR/gradle.properties"

      - name: Ajustar Java y Kotlin a JVM 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path("proyecto")

          files = list(project.rglob("build.gradle.kts")) + list(project.rglob("build.gradle"))

          print("Archivos Gradle encontrados:")

          for file in files:
              print(f" - {file}")

              text = file.read_text()

              # Java 8 -> Java 17
              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              # Kotlin JVM 1.8 -> 17
              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

              file.write_text(text)
          PY

      - name: Verificar Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: |
            proyecto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
