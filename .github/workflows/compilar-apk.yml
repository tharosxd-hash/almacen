name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Solicitud Almacén
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Comprobar estructura del proyecto
        shell: bash
        run: |
          test -f settings.gradle.kts || { echo 'ERROR: no se encuentra settings.gradle.kts en la raíz'; exit 1; }
          test -f app/build.gradle.kts || { echo 'ERROR: no se encuentra app/build.gradle.kts'; exit 1; }
          test -f app/google-services.json || { echo 'ERROR: falta app/google-services.json'; exit 1; }

      - name: Compilar APK de depuración
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
