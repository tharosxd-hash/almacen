name: Compilar APK - Permisos corregidos

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: solicitud-almacen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Encontrar y extraer ZIP corregido
        shell: bash
        run: |
          set -euo pipefail
          ZIP="solicitud_almacen_permisos_corregidos.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra $ZIP en la raíz del repositorio. Súbelo primero."
            ls -la
            exit 1
          fi
          mkdir -p proyecto
          unzip -q -o "$ZIP" -d proyecto
          SETTINGS="$(find proyecto -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle.kts."
            find proyecto -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto detectado: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Almacen-APK-permisos-corregidos
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
